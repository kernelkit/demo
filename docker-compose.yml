services:
  classic:
    image: ghcr.io/kernelkit/demo:latest
    build:
      context: ./classic
    environment:
      - DISPLAY=${DISPLAY}
      - SDL_AUDIODRIVER=pulseaudio
      - PULSE_SERVER=unix:${XDG_RUNTIME_DIR}/pulse/native
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XDG_RUNTIME_DIR}/pulse/native:${XDG_RUNTIME_DIR}/pulse/native
    network_mode: host
    stdin_open: true
    tty: true

  breeze:
    image: ghcr.io/kernelkit/breeze:latest
    build:
      context: ./breeze
    environment:
      - DISPLAY=${DISPLAY}
      - DISPLAY_ROTATE=${DISPLAY_ROTATE:-}
      - FULLSCREEN=${FULLSCREEN:-1}
      - LATITUDE=${LATITUDE}
      - LONGITUDE=${LONGITUDE}
      - LOCATION=${LOCATION}
      - WEB_URL=${WEB_URL}
      - CAROUSEL_WEATHER=${CAROUSEL_WEATHER:-}
      - CAROUSEL_FORECAST=${CAROUSEL_FORECAST:-}
      - CAROUSEL_URL=${CAROUSEL_URL:-}
      - DATE_FORMAT=${DATE_FORMAT:-}
      - FORECAST=${FORECAST:-1}
      - URL_SCRIPT=${URL_SCRIPT:-}
      - ZOOM=${ZOOM:-}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      # Without this the container runs in UTC and shows the wrong time
      - /etc/localtime:/etc/localtime:ro
    network_mode: host
    stdin_open: true
    tty: true
